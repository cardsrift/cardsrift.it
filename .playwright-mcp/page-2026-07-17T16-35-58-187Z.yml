            - definition [ref=f21e50]: Apro, verifico e giudico le condizioni sulla scala del mercato — NM, LP, MP, HP — sempre per difetto. Se è Lightly Played, nella scheda leggi Lightly Played.
          - generic [ref=f21e51]:
            - term [ref=f21e52]: La fotografo
            - definition [ref=f21e53]: "Se ha valore la scansiono fronte e retro: quello che vedi nella scheda è il pezzo che ricevi, non un’immagine di catalogo."
          - generic [ref=f21e54]:
            - term [ref=f21e55]: La imballo
            - definition [ref=f21e56]: Sleeve, top loader o rinforzo secondo il valore, poi busta o scatola rigida. Parte tracciata in 24/48h — come vorrei riceverla io.
