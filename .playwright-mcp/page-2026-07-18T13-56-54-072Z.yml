        - generic [ref=f24e27]: Guida alle condizioni
        - heading "Come classifichiamo le condizioni" [level=1] [ref=f24e28]
        - paragraph [ref=f24e29]: "La condizione conta quanto la carta stessa. Usiamo la scala ufficiale di Cardmarket — sette gradi, dalla Mint alla Poor — e la applichiamo sempre per difetto: nel dubbio, scendiamo di un gradino."
      - generic [ref=f24e32]:
        - generic [ref=f24e33]:
          - generic [ref=f24e34]: La scala
          - heading "Dalla Mint alla Poor" [level=2] [ref=f24e35]
          - paragraph [ref=f24e36]: Gli stessi sette gradi ufficiali di Cardmarket, il mercato di riferimento. Li leggi in ogni scheda prodotto, accanto al prezzo.
        - generic [ref=f24e37]:
          - generic [ref=f24e38]:
            - term [ref=f24e39]: Mint · MT
            - definition [ref=f24e40]: "Perfetta, come appena uscita dalla busta: angoli netti, superficie pulita, immacolata anche vista da vicino."
          - generic [ref=f24e41]:
            - term [ref=f24e42]: Near Mint · NM
            - definition [ref=f24e43]: "Quasi perfetta: al massimo un’impercettibile imperfezione, visibile solo a un esame attento. È la condizione più richiesta."
          - generic [ref=f24e44]:
            - term [ref=f24e45]: Excellent · EX
            - definition [ref=f24e46]: "Segni d’uso lievi: qualche micro-graffio o un accenno di consumo sui bordi, percepibili da vicino."
          - generic [ref=f24e47]:
            - term [ref=f24e48]: Good · GD
            - definition [ref=f24e49]: "Uso evidente ma carta integra: graffi, leggero sbiancamento dei bordi, a volte una piega minima."
          - generic [ref=f24e50]:
            - term [ref=f24e51]: Light Played · LP
            - definition [ref=f24e52]: "Uso marcato e ben visibile: bordi sbiancati, graffi sulla superficie, qualche piega leggera."
          - generic [ref=f24e53]:
            - term [ref=f24e54]: Played · PL
            - definition [ref=f24e55]: "Molto giocata: graffi profondi, pieghe evidenti, sbiancamento diffuso, piccoli difetti strutturali."
          - generic [ref=f24e56]:
            - term [ref=f24e57]: Poor · PO
            - definition [ref=f24e58]: "Fortemente segnata: pieghe importanti, strappi, aloni o scritte. Resta riconoscibile e giocabile in bustina."
      - generic [ref=f24e61]:
        - generic [ref=f24e62]:
          - generic [ref=f24e63]: Il nostro metodo
          - heading "Nel dubbio, un gradino sotto" [level=2] [ref=f24e64]
        - paragraph [ref=f24e66]: "Giudichiamo alla luce piena, fronte e retro, prima di assegnare un grado. Quando una carta è a cavallo tra due condizioni scegliamo la più bassa: meglio una sorpresa in positivo all’apertura. Le carte di valore le trovi fotografate davvero nella scheda, così il grado lo verifichi con i tuoi occhi."
      - generic [ref=f24e69]:
