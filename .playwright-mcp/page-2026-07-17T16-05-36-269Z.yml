          - generic [ref=f19e52]:
            - generic [ref=f19e53]: "02"
            - heading "Foto vere, non stock" [level=3] [ref=f19e54]
            - paragraph [ref=f19e55]: Le singole di valore le fotografo davvero, fronte e retro. Quello che vedi nella scheda è il pezzo che ricevi, non un’immagine di catalogo.
          - generic [ref=f19e56]:
            - generic [ref=f19e57]: "03"
            - heading "Imballo come lo vorrei io" [level=3] [ref=f19e58]
            - paragraph [ref=f19e59]: Sleeve, top loader o rinforzo secondo il valore, poi busta o scatola rigida. Spedisco ogni carta esattamente come vorrei riceverla io.
