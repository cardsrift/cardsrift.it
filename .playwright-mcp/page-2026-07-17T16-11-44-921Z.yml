            - heading "Foto vere, non stock" [level=3] [ref=f20e54]
            - paragraph [ref=f20e55]: Le singole di valore le fotografo davvero, fronte e retro. Quello che vedi nella scheda è il pezzo che ricevi, non un’immagine di catalogo.
          - generic [ref=f20e56]:
            - generic [ref=f20e57]: "03"
