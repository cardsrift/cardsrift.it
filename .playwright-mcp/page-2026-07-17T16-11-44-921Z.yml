      - generic [ref=f20e27]:
        - generic [ref=f20e28]: Chi siamo
        - heading "Un negozio di carte collezionabili tenuto da chi le colleziona" [level=1] [ref=f20e29]
        - paragraph [ref=f20e30]: "CardsRift è la mia collezione diventata negozio: Pokémon, One Piece e Magic, sealed e singole, controllate una a una e spedite come vorrei riceverle io. Il sito è nuovo, ma le carte le spedisco già da un po’ — con il 100% di valutazioni positive su Cardmarket."
      - generic [ref=f20e33]:
        - generic [ref=f20e34]:
          - generic [ref=f20e35]: La storia
          - heading "Come è nato CardsRift" [level=2] [ref=f20e36]
        - generic [ref=f20e37]:
          - paragraph [ref=f20e38]: "Mi chiamo Marco e colleziono carte da molto prima di venderle. CardsRift nasce da lì: dal voler trasformare una passione in un mestiere, e avere un motivo in più per continuare a raccontarla a chi la condivide."
          - paragraph [ref=f20e39]: "Ho iniziato dove iniziano quasi tutti i collezionisti seri, su Cardmarket. Cento e più spedizioni dopo, con ogni valutazione tornata positiva, ho aperto questo portale per fare le cose fino in fondo a modo mio: foto reali, condizioni dette come stanno, e qualcuno che risponde davvero dall’altra parte."
          - paragraph [ref=f20e40]: Sono una persona sola, non un magazzino. Ogni carta che parte è passata dalle mie mani.
